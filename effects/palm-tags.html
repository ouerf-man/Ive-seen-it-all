<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920">
<!-- palm-tags: a label floats above each hand and tilts with it. Best with both palms up, weighing two options. -->
<script>window.FX_START = 2.0;</script>
<script src="assets/gsap.min.js"></script><script src="assets/tracking.js"></script><script src="assets/fxkit.js"></script>
<style>
/* lets HyperFrames find and embed every font used in font: shorthands below */
.fontload{font-family:'Inter','JetBrains Mono','Montserrat','Playfair Display','League Gothic','Oswald','Archivo Black'}
:root{--ink:#13110D;--paper:#F1ECE2;--accent:#E0242F}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.tag{position:absolute;left:0;top:0;transform-origin:50% 100%;opacity:0}
.slab{position:relative;background:#ffffffee;color:#111114;font:800 44px 'Montserrat';letter-spacing:.04em;padding:20px 30px;border-radius:16px;display:flex;align-items:center;gap:16px;white-space:nowrap;box-shadow:0 18px 40px #0007}
.slab i{width:18px;height:18px;background:var(--accent);display:inline-block}
.notch{position:absolute;bottom:-16px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:18px solid #ffffffee}
</style></head>
<body><div id="root" data-composition-id="palm-tags" data-start="0" data-width="1080" data-height="1920" data-duration="4" data-fps="30">
<video id="plate" class="clip full" src="assets/plate.mp4" data-start="0" data-duration="4" data-media-start="2.0" muted playsinline data-track-index="0"></video>
<div id="tag0" class="tag"><div class="slab"><i></i><span>OLD WAY</span></div><div class="notch"></div></div>
<div id="tag1" class="tag"><div class="slab"><i></i><span>CLAUDE</span></div><div class="notch"></div></div>
<script>
const tl = gsap.timeline({ paused: true });
const state = [{ a: 0 }, { a: 0 }];
const pop = [{ s: .72 }, { s: .72 }];
FX.follow(tl, 0, 4, (t) => {
  const f = FX.face(t), hs = FX.hands(t);
  for (let k = 0; k < 2; k++) {
    const el = document.getElementById('tag' + k), h = hs[k];
    if (!h) { el.style.opacity = 0; continue; }
    const [px] = FX.palm(h);
    const top = Math.min(...[4, 8, 12, 16, 20].map((i) => h.pts[i][1]));
    const ang = Math.atan2(h.pts[9][0] - h.pts[0][0], -(h.pts[9][1] - h.pts[0][1])) * 180 / Math.PI;
    const tilt = Math.max(-19, Math.min(19, ang * .55));
    const w = el.offsetWidth, hh = el.offsetHeight;
    let x = Math.max(64, Math.min(1080 - 64 - w, px - w / 2));
    let y = top - 40 - hh;
    // never over the face: slide sideways away from it
    if (y < f.chin[1] + 30 && x < f.cx + f.w * .7 && x + w > f.cx - f.w * .7) x = px < f.cx ? Math.min(x, f.cx - f.w * .7 - w) : Math.max(x, f.cx + f.w * .7);
    x = Math.max(64, Math.min(1080 - 64 - w, x));
    el.querySelector('.notch').style.left = Math.max(20, Math.min(w - 52, px - x - 16)) + 'px';
    // tracking is already gap-filled; fade only when the hand is gone for good (seek-safe: no running state)
    let near = 0; for (let d = -3; d <= 3; d++) { const hd = FX.hands(t + d / 30)[k]; if (hd && hd.seen) near++; }
    gsap.set(el, { x, y, rotation: tilt, opacity: Math.min(1, near / 4), scale: pop[k].s });
  }
});
tl.to(pop[0], { s: 1, duration: .4, ease: 'back.out(2)' }, .1).to(pop[1], { s: 1, duration: .4, ease: 'back.out(2)' }, .25);
window.__timelines['palm-tags'] = tl;
</script>
</div></body></html>
